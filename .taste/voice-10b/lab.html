<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preference lab</title>
<style>
:root{
  --font:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --bg:#FFFFFF;--bg-2:#F6F7F9;--line:#E8E9ED;--ink:#121316;--ink-2:#62656E;--ink-3:#9A9DA6;--focus:#2F5BEA;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F11;--bg-2:#17181B;--line:#26282D;--ink:#F2F3F5;--ink-2:#A2A5AD;--ink-3:#6C6F77;--focus:#7C9BFF}}
:root[data-theme="dark"]{--bg:#0E0F11;--bg-2:#17181B;--line:#26282D;--ink:#F2F3F5;--ink-2:#A2A5AD;--ink-3:#6C6F77;--focus:#7C9BFF}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
kbd{font:inherit;font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px}
@media (hover:none){kbd{display:none}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{font-weight:600;font-size:15px}
.tabs,.seg{display:flex;gap:2px;background:var(--bg-2);padding:3px;border-radius:10px}
.tabs button,.seg button{padding:6px 11px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:13px}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line)}
.meta{margin-left:auto;display:flex;gap:14px;color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.scene b{font-weight:600;font-size:17px;letter-spacing:-.015em}
.scene span{color:var(--ink-3);font-size:13px;margin-left:8px}
.hint{color:var(--ink-3);font-size:12.5px;margin:-4px 0 14px}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:16px;transition:opacity .22s}
.duel.leaving{opacity:0}
.side{display:grid;gap:10px}
.pick{height:44px;border-radius:12px;background:var(--bg-2);font-weight:500;transition:background-color .2s,transform .12s}
.pick:hover{background:color-mix(in srgb,var(--ink) 7%,var(--bg))}
.pick:active{transform:scale(.98)}
.pick.chosen{background:var(--ink);color:var(--bg)}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.row2 button{padding:8px 14px;border-radius:10px;color:var(--ink-2);font-weight:500;font-size:13px}
.row2 button:hover{background:var(--bg-2);color:var(--ink)}
.after{display:grid;justify-items:center;gap:8px;margin-top:14px;min-height:64px}
.learned{color:var(--ink-2);font-size:13px;text-align:center}
.why{display:none;width:min(440px,100%);height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:13px}
.why.show{display:block}
@media (max-width:720px){.duel{grid-template-columns:1fr}.meta span:last-child{display:none}}
.step{color:var(--ink-2);font-size:13px;font-weight:500}
.board{display:grid;grid-template-columns:repeat(var(--k,3),minmax(0,1fr));gap:16px;transition:opacity .22s}
.board.leaving{opacity:0}
.card{display:grid;gap:10px;align-content:start;border-radius:22px;transition:opacity .2s}
.card .stage{min-height:260px;transition:box-shadow .2s}
.card.best .stage{box-shadow:0 0 0 2px var(--ink)}
.card.worst{opacity:.45}
.card.done:not(.best):not(.worst){opacity:.8}
.cap{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px;padding:0 4px}
.cap b{font-weight:600}
.cap a,.cap i{color:var(--ink-3);font-style:normal;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap a{text-decoration:underline;text-underline-offset:2px}
.card .pick.worst-mode{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.card.best .pick{background:var(--ink);color:var(--bg)}
@media (max-width:720px){.board{grid-template-columns:1fr}.card .stage{min-height:220px}.top-in{flex-wrap:wrap;gap:10px}.meta{margin-left:0}}
.head2{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head2 h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.head2 p{color:var(--ink-2);margin-top:4px;max-width:60ch;line-height:1.5}
.actions{display:flex;gap:8px}
.actions button{padding:8px 14px;border-radius:10px;background:var(--bg-2);font-weight:500;font-size:13px}
.actions .warn{color:#D14343}
.genes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:28px}
.gene{background:var(--bg-2);border-radius:14px;padding:14px}
.gene h3{font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:10px;display:flex;justify-content:space-between}
.gene h3 em{font-style:normal;color:var(--ink-3)}
.gv{display:grid;grid-template-columns:84px 1fr 28px;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;color:var(--ink-2)}
.gv.lead{color:var(--ink);font-weight:600}
.gv .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gv .track i{display:block;height:100%;background:var(--ink-3);border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gv.lead .track i{background:var(--ink)}
.gv em{font-style:normal;text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sub-title{font-size:15px;font-weight:600;margin-bottom:12px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gcell{display:grid;gap:8px}.gcell .cap{font-size:12.5px;color:var(--ink-3)}
.export{margin-top:14px;display:none}.export.show{display:block}
.export textarea{width:100%;height:180px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px}

/* Stage: the specimen frame. Always light so specimens are judged consistently. */
.stage{position:relative;min-height:300px;border-radius:20px;background:#fff;color:#15171B;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 0 0 1px var(--line);font-family:var(--font);padding:20px}
.stage.resetting>*{opacity:0;transition:opacity .18s}
</style>

<!-- ═══════════════ DOMAIN CSS: styles for specimens (rewrite per project) ═══════════════ -->
<style id="domain-css">
/* modern-ui 0.2.2, copied from knowledge-store/skills/modern-ui/primitives. Change the skill, then copy again. */
/* Motion primitives. Tokens default to taste.json; override via tasteVars() or :root. */
:root {
  --mx-accent: #2F5BEA;
  --mx-accent-fg: #FFFFFF;
  --mx-light: var(--mx-accent);           /* glows and marks only: needs 3:1, not 4.5:1 */
  --mx-ease: cubic-bezier(.2,.8,.2,1);   /* movement, pop-ins (may overshoot) */
  --mx-draw: cubic-bezier(.2,.8,.2,1);   /* strokes, fills, exits (never overshoots) */
  --mx-t: 1;                              /* tempo multiplier */
  --mx-stroke: 2.4;                       /* px at any size */
  --mx-r: 18px;                           /* panel radius */
  --mx-rb: 14px;                          /* button radius */
  --mx-h: 44px;                           /* button height */
  --mx-idle: #E3E5EA;                     /* inactive track / star / step */
}

@keyframes mx-pop   { from { transform: scale(0) } to { transform: scale(1) } }
@keyframes mx-draw  { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
@keyframes mx-in    { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@keyframes mx-out   { from { opacity: 1; transform: none } to { opacity: 0; transform: translateY(-6px) } }
@keyframes mx-spin  { to { transform: rotate(360deg) } }
@keyframes mx-shake { 20%,60% { transform: translateX(-4px) } 40%,80% { transform: translateX(4px) } }
@keyframes mx-ripple{ 0% { opacity: 0; transform: scale(.95) } 8% { opacity: .5 } 100% { opacity: 0; transform: scale(1.9) } }
@keyframes mx-burst { 0% { opacity: 0; transform: rotate(var(--a)) translateY(calc(var(--mx-size) * -.45)) scale(.3) }
                      15% { opacity: 1 }
                      100%{ opacity: 0; transform: rotate(var(--a)) translateY(calc(var(--mx-size) * -1)) scale(1) } }
@keyframes mx-glowp { 0% { opacity: 0; transform: scale(.5) } 35% { opacity: .45; transform: scale(1.2) } 100% { opacity: .16; transform: scale(1.05) } }
@keyframes mx-bob   { 0%,60%,100% { transform: none } 30% { transform: translateY(-3px) } }
@keyframes mx-pulse { 50% { opacity: .35 } }

/* ── SuccessMark ── */
.mx-mark { --mx-delay: 0s; position: relative; display: inline-block; width: var(--mx-size); height: var(--mx-size); flex: none; vertical-align: middle; }
.mx-mark > * { position: absolute; inset: 0; }
.mx-mark svg { width: 100%; height: 100%; overflow: visible; }
.mx-disc { border-radius: 50%; background: var(--mx-accent);
  animation: mx-pop calc(var(--mx-t) * .42s) var(--mx-ease) calc(var(--mx-t) * var(--mx-delay)) both; }
.mx-ring { transform: rotate(-90deg); }
.mx-ring circle, .mx-tick path { fill: none; stroke-width: calc(var(--mx-stroke) * 24px / var(--mx-sizen));
  stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.mx-ring circle { stroke: var(--mx-accent); animation: mx-draw calc(var(--mx-t) * .5s) var(--mx-draw) calc(var(--mx-t) * var(--mx-delay)) both; }
.mx-tick path { stroke: var(--mx-tick, var(--mx-accent));
  animation: mx-draw calc(var(--mx-t) * .34s) var(--mx-draw) calc(var(--mx-t) * (var(--mx-delay) + .2s)) both; }
.mx-mark[data-variant="filled"] .mx-ring { display: none; }
.mx-mark[data-variant="filled"] { --mx-tick: var(--mx-accent-fg); }
.mx-mark[data-variant="soft"] .mx-ring { display: none; }
.mx-mark[data-variant="soft"] .mx-disc { background: color-mix(in srgb, var(--mx-accent) 15%, #fff); }
.mx-mark[data-variant="outline"] .mx-disc { display: none; }
.mx-mark[data-variant="bare"] .mx-disc, .mx-mark[data-variant="bare"] .mx-ring { display: none; }
.mx-mark[data-variant="bare"] .mx-tick { transform: scale(1.3); }
.mx-fx { display: none; }
.mx-mark[data-flourish="ripple"] .mx-fx-ripple { display: block; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--mx-accent); opacity: 0;
  animation: mx-ripple calc(var(--mx-t) * .8s) var(--mx-draw) calc(var(--mx-t) * (var(--mx-delay) + .26s)) both; }
.mx-mark[data-flourish="burst"] .mx-fx-burst { display: block; }
.mx-fx-burst i { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--mx-accent); opacity: 0;
  animation: mx-burst calc(var(--mx-t) * .62s) var(--mx-draw) calc(var(--mx-t) * (var(--mx-delay) + .24s)) both; }
.mx-mark[data-flourish="glow"] .mx-fx-glow { display: block; border-radius: 50%; background: var(--mx-accent); filter: blur(calc(var(--mx-size) / 4)); opacity: 0;
  animation: mx-glowp calc(var(--mx-t) * 1.1s) var(--mx-draw) calc(var(--mx-t) * (var(--mx-delay) + .12s)) both; }

/* ── MorphButton: label → spinner → mark, in place ── */
.mx-morph-wrap { display: grid; justify-items: center; width: 100%; }
.mx-morph { box-sizing: border-box; position: relative; display: inline-grid; grid-template-columns: minmax(0, 1fr); place-items: center; height: var(--mx-h); padding: 0 20px;
  border: 0; border-radius: var(--mx-rb); background: var(--mx-accent); color: var(--mx-accent-fg); font: inherit; font-weight: 600;
  white-space: nowrap; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: width calc(var(--mx-t) * .42s) var(--mx-ease), border-radius calc(var(--mx-t) * .42s) var(--mx-ease),
              padding calc(var(--mx-t) * .42s) var(--mx-ease), background-color .2s, transform .12s ease-out; }
.mx-morph > * { grid-area: 1 / 1; }
.mx-morph:active:not(:disabled) { transform: scale(.97); }
.mx-morph:focus-visible { outline: 2px solid var(--mx-accent); outline-offset: 3px; }
.mx-morph:disabled { cursor: default; }
.mx-morph[data-status="pending"], .mx-morph[data-status="success"] { padding: 0; border-radius: calc(var(--mx-h) / 2); }
.mx-morph[data-status="success"]:not([data-mark="filled"]) { background: transparent; }
.mx-morph[data-status="error"] { animation: mx-shake .36s ease-out; }
.mx-morph-label { transition: opacity .12s; }
.mx-morph[data-status="pending"] .mx-morph-label, .mx-morph[data-status="success"] .mx-morph-label { opacity: 0; }
.mx-spinner { display: inline-block; box-sizing: border-box; width: 18px; height: 18px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 35%, transparent);
  border-top-color: currentColor; opacity: 0; transition: opacity .15s; animation: mx-spin .7s linear infinite; }
.mx-spinner[data-visible="true"] { opacity: 1; }

/* ── SwapText ── */
.mx-swap { display: inline-grid; }
.mx-swap > * { grid-area: 1 / 1; }
.mx-swap-in  { animation: mx-in calc(var(--mx-t) * .36s) var(--mx-ease) calc(var(--mx-t) * .06s) both; }
.mx-swap-out { animation: mx-out calc(var(--mx-t) * .2s) var(--mx-draw) both; pointer-events: none; }

/* ── ProgressFill ── */
.mx-progress { height: 4px; border-radius: 2px; background: var(--mx-idle); overflow: hidden; }
.mx-progress > i { display: block; height: 100%; background: var(--mx-accent); transform-origin: left;
  transition: transform calc(var(--mx-t) * .5s) var(--mx-draw); }

/* ── StepTracker ── */
.mx-steps { display: flex; align-items: flex-start; }
.mx-step { display: grid; justify-items: center; gap: 8px; min-width: 64px; font-size: 12px; text-align: center; }
.mx-step-dot { position: relative; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--mx-idle); }
.mx-step-dot > .mx-mark { position: absolute; inset: 0; }
.mx-step[data-state="active"] .mx-step-dot { box-shadow: inset 0 0 0 2px var(--mx-accent); }
.mx-step[data-state="active"] .mx-step-dot::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--mx-accent); animation: mx-pulse 1.2s ease-in-out infinite; }
.mx-step-link { flex: 1; height: 2px; margin-top: 10px; background: var(--mx-idle); overflow: hidden; border-radius: 1px; }
.mx-step-link > i { display: block; height: 100%; background: var(--mx-accent); transform-origin: left; transform: scaleX(0);
  transition: transform calc(var(--mx-t) * .45s) var(--mx-draw); }
.mx-step-link[data-done="true"] > i { transform: scaleX(1); }

/* ── TypingDots ── */
.mx-typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.mx-typing i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .45; animation: mx-bob 1s ease-in-out infinite; }
.mx-typing i:nth-child(2) { animation-delay: .15s; } .mx-typing i:nth-child(3) { animation-delay: .3s; }

/* ── Edge light: the shared core of EdgeBolt and AiGlow ──
   Lag-free by construction: a STATIC conic gradient on an oversized square that only
   rotates (transform), clipped to the border by a STATIC mask. Animating the gradient
   angle itself (@property), offset-distance or stroke-dashoffset repaints every frame;
   this paints once. Measured by scripts/motion_cost.cjs. */
.mx-edge { position: relative; isolation: isolate; border-radius: var(--mx-edge-r, var(--mx-r)); }
.mx-edge > :not(.mx-edge-ring):not(.mx-edge-halo) { position: relative; z-index: 1; }
.mx-edge-ring, .mx-edge-halo { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  opacity: 0; transition: opacity calc(var(--mx-t) * .35s) var(--mx-draw); }
.mx-edge-ring, .mx-edge-halo > span { overflow: hidden; container-type: size;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.mx-edge-ring { z-index: 2; padding: var(--mx-edge-w, 2px); }
/* halo: the same light on a slightly wider ring, blurred by its parent so it falls off with
   distance from the edge. It sits behind the (opaque) card, so only the outer half shows. */
.mx-edge-halo { z-index: 0; filter: blur(var(--mx-edge-glow, 6px)); }
.mx-edge-halo > span { position: absolute; inset: -2px; border-radius: inherit; padding: 5px; }
.mx-edge-ring > i, .mx-edge-halo i { position: absolute; left: 50%; top: 50%; width: 150cqmax; aspect-ratio: 1; translate: -50% -50%;
  background: var(--mx-edge-paint); animation: mx-spin calc(var(--mx-t) * var(--mx-edge-lap, 1.6s)) linear infinite; will-change: transform; }
.mx-edge[data-state="run"] .mx-edge-ring { opacity: 1; }
.mx-edge[data-state="run"] .mx-edge-halo { opacity: .7; }
/* land: the whole border lights once, then everything fades. Pair it with a SuccessMark. */
.mx-edge-ring::after { content: ""; position: absolute; inset: 0; background: var(--mx-light); opacity: 0; }
.mx-edge[data-state="land"] .mx-edge-ring { opacity: 1; animation: mx-land-out calc(var(--mx-t) * .7s) var(--mx-draw) both; }
.mx-edge[data-state="land"] .mx-edge-ring::after { animation: mx-land calc(var(--mx-t) * .7s) var(--mx-draw) both; }
@keyframes mx-land     { 0% { opacity: 0 } 30% { opacity: 1 } 100% { opacity: 0 } }
@keyframes mx-land-out { 0%, 45% { opacity: 1 } 100% { opacity: 0 } }

/* EdgeBolt: one small light travelling the border while the card loads. */
.mx-bolt { --mx-edge-paint: conic-gradient(transparent 0 var(--mx-bolt-tail, 300deg),
  color-mix(in srgb, var(--mx-light) 40%, transparent) calc(var(--mx-bolt-tail, 300deg) + 30deg),
  var(--mx-light) 356deg, color-mix(in srgb, var(--mx-light) 30%, #fff) 359deg, transparent 360deg); }
.mx-bolt[data-twin="true"] { --mx-edge-paint: conic-gradient(transparent 0 130deg, var(--mx-light) 176deg, transparent 180deg 310deg, var(--mx-light) 356deg, transparent 360deg); }

/* AiGlow: the multicolour version, for content an AI is working on. */
.mx-glow { --mx-edge-paint: conic-gradient(transparent 0deg 110deg, #5AD1FF 160deg, #7A6BFF 210deg, #FF5FA2 260deg, #FFB547 300deg, transparent 340deg); --mx-edge-lap: 2s; }
.mx-glow[data-state="run"] .mx-edge-halo { opacity: .6; }

/* ── LevelRing: the microphone visibly hears someone ──
   Two discs behind the child scale with loudness: the inner one follows fast, the outer
   one trails slowly, so a spoken word leaves a short echo. Only transform changes. */
.mx-level { position: relative; display: inline-grid; place-items: center; isolation: isolate; }
.mx-level > :not(.mx-level-disc) { position: relative; z-index: 1; }
.mx-level-disc { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; opacity: 0; will-change: transform;
  transform: scale(calc(1 + var(--mx-level, 0) * var(--mx-level-reach, .5)));
  transition: transform calc(var(--mx-t) * 90ms) linear, opacity calc(var(--mx-t) * .3s) var(--mx-draw); }
.mx-level-disc[data-layer="inner"] { background: color-mix(in srgb, var(--mx-level-c, var(--mx-light)) 22%, transparent); }
.mx-level-disc[data-layer="outer"] { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--mx-level-c, var(--mx-light)) 45%, transparent);
  transform: scale(calc(1.06 + var(--mx-level, 0) * var(--mx-level-reach, .5) * 1.25));
  transition: transform calc(var(--mx-t) * 420ms) var(--mx-draw), opacity calc(var(--mx-t) * .3s) var(--mx-draw); }
.mx-level[data-active="true"] .mx-level-disc { opacity: 1; }

/* ── FillFrom: a colour grows from where the finger touched until it covers the card ── */
.mx-fill-host { position: relative; overflow: hidden; isolation: isolate; }
.mx-fill-host > :not(.mx-fill) { position: relative; z-index: 1; transition: color calc(var(--mx-t) * .2s) var(--mx-draw) calc(var(--mx-t) * .08s); }
.mx-fill-host[data-filled="true"] > :not(.mx-fill) { color: var(--mx-fill-fg, #fff); }
.mx-fill { position: absolute; z-index: 0; border-radius: 50%; pointer-events: none; background: var(--mx-fill-c, var(--mx-accent));
  transform: translate(-50%, -50%) scale(0); animation: mx-fill calc(var(--mx-t) * .46s) var(--mx-draw) both; }
@keyframes mx-fill { to { transform: translate(-50%, -50%) scale(1) } }

@media (prefers-reduced-motion: reduce) {
  .mx-mark *, .mx-swap > *, .mx-morph, .mx-progress > i, .mx-step-link > i, .mx-fill, .mx-level-disc, .mx-edge-ring, .mx-edge-halo { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }

  .mx-edge-ring > i, .mx-edge-halo i { animation: none; background: var(--mx-light); opacity: .5; }
}

/* Suara lab, round 2. Round 1's clear picks are held fixed; the three "none of these"
   decisions get new options sourced from ElevenLabs UI and Airbnb's live site. */
.stage{min-height:600px;padding:14px}
[data-tab="compare"]{display:none}
.ph{--ink:#222222;--muted:#6C6C6C;--line:#DDDDDD;--div:#EBEBEB;--skel:#EBEBEB;
  --blue:#007AFF;--act:#222222;--rb:var(--s-rb,12px);
  width:300px;height:570px;border-radius:30px;background:var(--page,#fff);box-shadow:0 0 0 1px #E5E5EA,0 12px 30px -18px rgb(0 0 0/35%);
  overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:12px 18px 18px;text-align:left;color:var(--ink);position:relative;
  font-family:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',sans-serif}
.ph *{box-sizing:border-box;margin:0}
.ph .grow{flex:1}
.ph h1{font-size:var(--h-size,26px);font-weight:var(--h-weight,600);letter-spacing:var(--h-ls,-.02em);line-height:1.15}
.ph .lead{font-size:14px;color:var(--muted);line-height:1.45}
.ph .small{font-size:12.5px;color:var(--muted)}
.ph .center{text-align:center}

/* Headers */
.ph .bar{display:flex;align-items:center;gap:8px;min-height:36px}
.ph .mark{width:28px;height:28px;border-radius:8px;background:#222;display:grid;place-items:center;color:#fff}
.ph .brand{font-weight:700;font-size:16px;margin-right:auto;letter-spacing:-.02em}
.ph .pill{height:32px;padding:0 12px;border-radius:999px;background:#F4F5F7;display:grid;place-items:center;font-size:12.5px;font-weight:600}
.ph .ask{flex:1;height:44px;border-radius:40px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgb(0 0 0/10%);
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:600}
.ph .globe{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:11px;font-weight:700}

/* Buttons */
.ph .btn{height:var(--b-h,48px);border-radius:var(--rb);background:var(--act);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;flex:none}
.ph .link{font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:center;padding:10px}
.ph .quiet{height:44px;border-radius:var(--rb);background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:600}

/* Topic entry */
.ph .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ph .chip{height:34px;padding:0 12px;border-radius:24px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:6px;font-size:12.5px}

/* Mic button (home) */
.ph .mz{display:grid;justify-items:center;gap:12px;padding-top:30px}
.ph .mic{width:140px;height:140px;border-radius:50%;background:var(--act);color:#fff;display:grid;place-items:center}
.ph .mic svg{width:40%;height:40%}
.ph .miclbl{font-size:16px;font-weight:600}

/* ── ElevenLabs-style orb, redrawn lag-free: blurred blobs on layers that only rotate. ── */
.orb{--o:160px;position:relative;width:var(--o);height:var(--o);border-radius:50%;overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 50% 42%,var(--c0) 0%,var(--c1) 48%,var(--c2) 100%);
  box-shadow:0 18px 50px -18px var(--c2),inset 0 -10px 30px rgb(255 255 255/35%);transform:translateZ(0)}
.orb i{position:absolute;inset:-20%;will-change:transform}
.orb i::before{content:'';position:absolute;border-radius:50%;filter:blur(calc(var(--o)*.1))}
.orb .o1::before{left:18%;top:14%;width:52%;height:40%;background:var(--b1);opacity:.95}
.orb .o2::before{left:40%;top:44%;width:48%;height:44%;background:var(--b2);opacity:.85}
.orb .o3::before{left:22%;top:52%;width:34%;height:30%;background:#fff;opacity:.8}
.stage.play .orb .o1{animation:mx-spin var(--s1,6s) linear infinite}
.stage.play .orb .o2{animation:mx-spin var(--s2,9s) linear infinite reverse}
.stage.play .orb .o3{animation:mx-spin var(--s3,4.5s) linear infinite}
.orb::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgb(255 255 255/.55),transparent 42%);z-index:2}
.orb-wrap{display:grid;place-items:center;will-change:transform}
.stage.play .orb-wrap[data-s="listen"]{animation:s-talk 3s linear infinite}
.stage.play .orb-wrap[data-s="think"]{animation:s-breathe 2.4s ease-in-out infinite}
.orb-wrap[data-s="listen"] .orb{--s1:2.6s;--s2:3.8s;--s3:2s}
.orb-wrap[data-s="think"] .orb{--s1:3.5s;--s2:5s;--s3:2.8s}
@keyframes s-talk{0%,100%{transform:scale(1)}8%{transform:scale(1.07)}16%{transform:scale(1.01)}24%{transform:scale(1.09)}34%{transform:scale(1.02)}44%{transform:scale(1.06)}56%{transform:scale(1.03)}64%{transform:scale(1.08)}76%,94%{transform:scale(1)}}
@keyframes s-breathe{50%{transform:scale(.93)}}

/* ElevenLabs voice button: a pill with a live waveform inside */
.vbtn{width:250px;height:76px;border-radius:40px;background:color-mix(in srgb,var(--c2) 16%,#fff);display:flex;align-items:center;gap:12px;padding:0 18px}
.vbtn .stop{width:44px;height:44px;border-radius:50%;background:#222;display:grid;place-items:center;color:#fff;flex:none}
.vbtn .bars{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;height:44px;
  -webkit-mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.vbtn .bars i{width:3px;height:30px;border-radius:1.5px;background:var(--bar);transform:scaleY(.15);will-change:transform}
.stage.play .vbtn .bars i{animation:s-bar 1.1s ease-in-out infinite alternate}

/* ElevenLabs bar visualiser: 15 round bars in a soft box; the lit layer only changes opacity */
.bviz{width:250px;height:128px;border-radius:16px;background:#F4F5F7;display:flex;align-items:center;justify-content:center;gap:6px;padding:16px}
.bviz i{position:relative;width:10px;height:92px;border-radius:999px;transform:scaleY(.25);will-change:transform}
.bviz i::before,.bviz i::after{content:'';position:absolute;inset:0;border-radius:inherit}
.bviz i::before{background:#DDDDDD}
.bviz i::after{background:var(--bar);opacity:0}
.stage.play .bviz i{animation:s-bar 1.2s ease-in-out infinite alternate}
.stage.play .bviz i::after{animation:s-lit 1.5s steps(1) infinite}
@keyframes s-bar{0%{transform:scaleY(.18)}100%{transform:scaleY(1)}}
@keyframes s-lit{0%,40%{opacity:1}41%,100%{opacity:0}}

/* Thinking: ElevenLabs shimmering text, redrawn with transforms (a moving window, the text held still) */
.shim{position:relative;display:inline-block;white-space:nowrap}
.shim .base{color:#B0B0B5}
.shim .win{position:absolute;left:0;top:0;height:100%;width:40%;overflow:hidden;will-change:transform;
  -webkit-mask:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent)}
.shim .hi{position:absolute;left:0;top:0;color:#222;will-change:transform}
.stage.play .shim .win{animation:s-win 2.5s linear infinite}
.stage.play .shim .hi{animation:s-hi 2.5s linear infinite}
@keyframes s-win{0%{transform:translateX(-100%)}80%,100%{transform:translateX(250%)}}
@keyframes s-hi{0%{transform:translateX(40%)}80%,100%{transform:translateX(-100%)}}
.skel{display:grid;gap:9px;padding:16px;border-radius:var(--card-r,20px);background:#fff;box-shadow:var(--card-sh)}
.skel i{display:block;height:11px;border-radius:4px;background:var(--skel)}
.skel i:nth-child(1){width:34%}.skel i:nth-child(2){width:86%;height:16px}.skel i:nth-child(3){width:66%}
.stage.play .skel.pulse i{animation:s-pulse 1.4s ease-in-out infinite}
@keyframes s-pulse{50%{opacity:.45}}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--bar)}
.stage.play .dots i{animation:s-dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes s-dot{0%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* Answer cards */
.ph .sc{border-radius:var(--card-r,20px);background:#fff;box-shadow:var(--card-sh);padding:14px 16px;display:grid;gap:5px}
.ph[data-card="rows"] .sc{box-shadow:none;border-radius:0;padding:12px 0;border-bottom:1px solid var(--div)}
.ph .sc .t{font-size:16px;font-weight:600;line-height:1.25}
.ph .sc .t.lg{font-size:18px}
.ph .sc .sum{font-size:13px;color:var(--muted);line-height:1.4}
.ph .sc .meta{font-size:12.5px;color:var(--muted)}
.ph .bm{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.ph .said{font-size:13px;color:var(--muted)}
.ph .said b{color:var(--ink);font-weight:600}

/* Yes / no, three Airbnb-sourced ways */
.ph .sheet-bg{position:absolute;inset:0;background:rgb(0 0 0/28%)}
.ph .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:32px 32px 0 0;box-shadow:0 8px 28px rgb(0 0 0/28%);
  padding:26px 20px 20px;display:grid;gap:12px;text-align:center}
.ph .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph .tile{position:relative;height:120px;border-radius:16px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;align-content:center;gap:8px;font-size:15px;font-weight:600}
.ph .tile svg{width:30px;height:30px}
.ph .tile .ring{position:absolute;inset:-1px;border-radius:16px;box-shadow:inset 0 0 0 2px #222;opacity:0}
.stage.play .ph .tile.s-pick .ring{animation:s-show .2s ease-out .9s both}
.stage.play .ph .tile.s-pick{animation:s-press .25s ease-out .75s both}
.ph .lcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph .lc{position:relative;border-radius:20px;background:#fff;box-shadow:0 2px 4px rgb(0 0 0/18%),0 0 0 1px rgb(0 0 0/8%);padding:12px;display:grid;gap:10px}
.ph .lc .art{height:92px;border-radius:14px;display:grid;place-items:center}
.ph .lc .art svg{width:40px;height:40px}
.ph .lc.y .art{background:linear-gradient(160deg,#E9F6EC,#D3EEDB);color:#1F7A36}
.ph .lc.n .art{background:linear-gradient(160deg,#FBECEE,#F6D9DD);color:#B3122A}
.ph .lc b{font-size:14.5px;font-weight:600;text-align:center}
.ph .lc .ring{position:absolute;inset:0;border-radius:20px;box-shadow:inset 0 0 0 2px #222;opacity:0}
.stage.play .ph .lc.s-pick .ring{animation:s-show .2s ease-out .9s both}
.stage.play .ph .lc.s-pick{animation:s-press .25s ease-out .75s both}
.stage.play .ph .btn.pressme{animation:s-press .25s ease-out .75s both}
@keyframes s-show{to{opacity:1}}
@keyframes s-press{50%{transform:scale(.96)}}
.ph .done{display:grid;justify-items:center;gap:12px;text-align:center;padding-top:40px}
.stage:not(.play) .ph .mx-mark *{animation:none!important}
/* Long source captions must truncate, not widen the card (found on the yes/no screen). */
#board .card{min-width:0}
#board .card>.stage,#board .card>.cap{max-width:100%;min-width:0}
#board .card .cap a,#board .card .cap i{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
/* ═══════════════ DOMAIN: Suara round 2, 10 decisions, one screen each ═══════════════
   Held fixed from round 1 (obs-0047): just the mic on home, black action, Apple blue,
   best answer large, standard speed, tick and ripple. Round 1 said "none of these" to the
   listening, loading and yes/no options; the owner named ElevenLabs UI for listening and
   Airbnb cards for choices, and "cleaner" overall. Values below are read from ElevenLabs UI's
   source (github.com/elevenlabs/ui) and Airbnb's live site (computed styles, 2026-09-24). */
const EL = (c) => ({name: 'ElevenLabs UI ' + c, url: 'https://github.com/elevenlabs/ui/tree/main/apps/www/registry/elevenlabs-ui/ui'});
const AB = (what) => ({name: 'Airbnb, measured: ' + what, url: 'https://www.airbnb.com/'});
const LAB = {
  id: 'suara-voice-10b',
  title: 'Suara · round 2 · 10 choices',
  choose: 3, askWorst: false, repeatEvery: 0,
  order: ['listen', 'voice', 'think', 'confirm', 'heading', 'header', 'topics', 'page', 'card', 'button'],
  genes: {
    listen:  {label: 'While it listens', scene: 'listening', values: {
      orb:  {name: 'A living orb', source: EL('Orb')},
      vbtn: {name: 'Voice button with a waveform', source: EL('Voice Button')},
      bviz: {name: 'Bar visualiser', source: EL('Bar Visualizer')}}},
    voice:   {label: 'Colour of the voice', scene: 'listening', values: {
      pastel: {name: 'Soft blue-grey', source: {name: 'ElevenLabs Orb default #CADCFC / #A0B9D1', url: 'https://github.com/elevenlabs/ui'}},
      apple:  {name: 'Apple blue', source: 'Round 1 pick'},
      mono:   {name: 'Greys only', source: 'Generated: the extreme'}}},
    think:   {label: 'While it finds the answer', scene: 'searching', values: {
      orb:   {name: 'The orb, thinking', source: EL('Orb, thinking state')},
      shim:  {name: 'Shimmering words', source: EL('Shimmering Text')},
      pulse: {name: 'Grey outline, pulsing', source: AB('#EBEBEB loading bars')}}},
    confirm: {label: 'Yes and no', scene: 'confirm', values: {
      sheet: {name: 'A sheet, one black button', source: AB('sheet 32px, button #222 8px 48px')},
      tiles: {name: 'Two outlined tiles', source: AB('tiles, 1px #DDD, 2px #222')},
      cards: {name: 'Two picture cards', source: AB('listing card shadow')}}},
    heading: {label: 'Headings', scene: 'home', values: {
      airbnb: {name: 'Medium, 26px', source: AB('26px / 600, -0.02em')},
      bold:   {name: 'Heavy, 34px', source: 'Current Suara'},
      light:  {name: 'Light, 30px', source: 'Generated: the extreme'}}},
    header:  {label: 'Top of the screen', scene: 'home', values: {
      suara: {name: 'Logo, Find, English', source: 'Current Suara'},
      ask:   {name: 'One search pill', source: AB('search pill, 40px, shadow 0 6px 20px')},
      none:  {name: 'Nearly nothing', source: 'Generated: the extreme'}}},
    topics:  {label: 'Where the topics are', scene: 'home', values: {
      quiet: {name: 'One button', source: 'Round 1 pick'},
      chips: {name: 'A row of chips', source: AB('chips 34px, 24px radius, 1px #DDDDDD')},
      link:  {name: 'A text link'}}},
    page:    {label: 'Background', scene: 'results', values: {
      white: {name: 'White', source: 'Current Suara'},
      warm:  {name: 'Warm off-white', source: AB('sheet #F4F2EC')},
      grey:  {name: 'Light grey', source: AB('#F7F7F7')}}},
    card:    {label: 'Answer cards', scene: 'results', values: {
      lift:   {name: 'White, soft shadow', source: 'Round 1 pick'},
      airbnb: {name: 'Rounder, crisper shadow', source: AB('card 28px, 0 2px 4px 18% + 1px ring')},
      rows:   {name: 'No cards, just lines', source: AB('#EBEBEB dividers')}}},
    button:  {label: 'Main buttons', scene: 'done', values: {
      airbnb: {name: 'Near-black, gently rounded', source: AB('#222, 8px, 48px')},
      pill:   {name: 'Black pill'},
      current:{name: 'Black, rounder corners', source: 'Current Suara'}}},
  },
  scenes: [
    {id: 'home', name: 'Home', group: 'Start'},
    {id: 'listening', name: 'Listening', group: 'Voice'},
    {id: 'searching', name: 'Finding the answer', group: 'Voice'},
    {id: 'results', name: 'Answers', group: 'Answers'},
    {id: 'confirm', name: 'Start these steps?', group: 'Steps'},
    {id: 'done', name: 'Finished', group: 'Steps'},
  ],
  priors: {},
  pool: null,
  render: renderSuara2,
};

const IC = {
  wave: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>',
  micSm: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  stop: '<svg width="16" height="16" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.3l3 3 6-6.3"/></svg>',
  cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
};
const PALETTE = {
  pastel: {c0: '#FFFFFF', c1: '#CADCFC', c2: '#A0B9D1', b1: '#E4EDFF', b2: '#8FA9C4', bar: '#8FA9C4'},
  apple:  {c0: '#FFFFFF', c1: '#9CCBFF', c2: '#007AFF', b1: '#D6EAFF', b2: '#0062CC', bar: '#007AFF'},
  mono:   {c0: '#FFFFFF', c1: '#DADADE', c2: '#8E8E93', b1: '#F2F2F7', b2: '#6C6C70', bar: '#6C6C70'},
};
const HEAD = {airbnb: ['26px', 600, '-0.02em'], bold: ['34px', 700, '-0.03em'], light: ['30px', 500, '-0.01em']};
const PAGE = {white: '#FFFFFF', warm: '#F4F2EC', grey: '#F7F7F7'};
const CARD = {lift: ['18px', '0 1px 2px rgb(0 0 0/5%),0 8px 22px rgb(0 0 0/8%)'], airbnb: ['28px', '0 2px 4px rgb(0 0 0/18%),0 0 0 1px rgb(0 0 0/8%)'], rows: ['0', 'none']};
const BTN = {airbnb: ['#222222', '8px', '48px'], pill: ['#000000', '999px', '52px'], current: ['#000000', '16px', '52px']};

const orb = (state, size, pal) => `<div class="orb-wrap" data-s="${state}"><div class="orb" style="--o:${size}px;--c0:${pal.c0};--c1:${pal.c1};--c2:${pal.c2};--b1:${pal.b1};--b2:${pal.b2}"><i class="o1"></i><i class="o2"></i><i class="o3"></i></div></div>`;
const mark = (size, flourish) => `<span class="mx-mark" aria-hidden="true" data-variant="filled" data-flourish="${flourish}" style="--mx-size:${size}px;--mx-sizen:${size};--mx-delay:.1s;--mx-stroke:${size > 40 ? 4.5 : 2.6}"><span class="mx-fx mx-fx-glow"></span><span class="mx-fx mx-fx-ripple"></span><span class="mx-fx mx-fx-burst">${'<i></i>'.repeat(8)}</span><span class="mx-disc"></span><svg class="mx-ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.8" pathLength="1"/></svg><svg class="mx-tick" viewBox="0 0 24 24"><path d="M7.4 12.4l3.1 3.1 6.2-6.4" pathLength="1"/></svg></span>`;
const bars = (n, cls) => Array.from({length: n}, (_, i) => `<i style="animation-delay:-${((i * 0.37) % 1.1).toFixed(2)}s"></i>`).join('');

function header(kind) {
  if (kind === 'ask') return `<div class="bar"><span class="ask">${IC.micSm}Ask Suara anything</span><span class="globe">EN</span></div>`;
  if (kind === 'none') return `<div class="bar"><span class="brand" style="font-size:15px">Suara</span><span class="small" style="font-weight:600;color:#222">EN</span></div>`;
  return `<div class="bar"><span class="mark">${IC.wave}</span><span class="brand">Suara</span><span class="pill">Find</span><span class="pill">English</span></div>`;
}

function renderSuara2(el, scene, g) {
  const pal = PALETTE[g.voice], [hs, hw, hl] = HEAD[g.heading], [cr, csh] = CARD[g.card], [ba, br, bh] = BTN[g.button];
  const vars = `--h-size:${hs};--h-weight:${hw};--h-ls:${hl};--page:${PAGE[g.page]};--card-r:${cr};--card-sh:${csh};--act:${ba};--s-rb:${br};--b-h:${bh};` +
    `--bar:${pal.bar};--mx-light:#007AFF;--mx-accent:#007AFF;--mx-t:1.15`;
  let body = '', cycle = null;

  if (scene === 'home') {
    const topics = g.topics === 'chips'
      ? `<div class="grow"></div><p class="small center">Or pick a topic</p><div class="chips">${['🩺 Health costs', '💰 CPF', '🛡️ Scams', '🚌 Getting around', '🏠 Bills', '📱 Phone help'].map((x) => `<span class="chip">${x}</span>`).join('')}</div>`
      : g.topics === 'link' ? `<div class="grow"></div><p class="link">Browse topics instead</p>`
      : `<div class="grow"></div><div class="quiet">Or pick a topic</div>`;
    body = `<h1 style="margin-top:6px">What do you need?</h1><div class="mz"><div class="mic" style="background:${ba}">${IC.mic}</div><p class="miclbl">Tap to speak</p></div>${topics}`;
  }

  if (scene === 'listening') {
    const vis = g.listen === 'orb' ? orb('listen', 170, pal)
      : g.listen === 'vbtn' ? `<div class="vbtn" style="--c2:${pal.c2}"><span class="stop">${IC.stop}</span><span class="bars">${bars(34)}</span></div>`
      : `<div class="bviz">${bars(15)}</div>`;
    body = `<h1 style="margin-top:6px">I'm listening</h1><p class="lead">Say it in your own words. Take your time.</p>
      <div class="grow" style="display:grid;place-items:center">${vis}</div>
      ${g.listen === 'vbtn' ? '<p class="miclbl center">Tap the square when done</p>' : `<div style="display:grid;justify-items:center;gap:8px"><div class="mic" style="width:56px;height:56px;background:${ba}">${IC.stop}</div><p class="small">Tap when done</p></div>`}`;
    cycle = 3000;
  }

  if (scene === 'searching') {
    const said = `<p class="said">You said <b>How much is a polyclinic visit for me?</b></p>`;
    const vis = g.think === 'orb'
      ? `<div class="grow" style="display:grid;place-items:center;align-content:center;gap:18px">${orb('think', 120, pal)}<h1 style="font-size:20px">Finding answers</h1></div>`
      : g.think === 'shim'
      ? `<h1><span class="shim"><span class="base">Finding answers</span><span class="win"><span class="hi">Finding answers</span></span></span></h1><div class="skel"><i></i><i></i><i></i></div>`
      : `<h1>Finding answers</h1><div class="skel pulse"><i></i><i></i><i></i></div><div class="skel pulse"><i></i><i></i></div>`;
    body = `${said}${vis}`;
    cycle = 2500;
  }

  if (scene === 'results') {
    const row = (t, m) => `<div class="sc"><span class="t">${t}</span><span class="meta">${m}</span></div>`;
    body = `<p class="said">You said <b>How much is a polyclinic visit for me?</b></p>
      <div class="sc"><span class="bm">${mark(18, 'none')}Best match</span><span class="t lg">Polyclinic fees for seniors</span><span class="sum">Pioneer and Merdeka cardholders pay less at polyclinics.</span><span class="meta">Answer · MOH</span></div>
      ${row('CHAS card: what it covers', 'Answer · MOH')}${row('MediSave for outpatient bills', '2 steps · CPF')}${row('Replacing a lost Pioneer card', 'Answer · MOH')}`;
  }

  if (scene === 'confirm') {
    const title = `<h1>Start these steps?</h1><p class="lead">MediSave for outpatient bills. 2 steps, and you confirm each one.</p>`;
    if (g.confirm === 'sheet') {
      body = `<div style="opacity:.5">${title}</div><div class="sheet-bg"></div><div class="sheet"><h1 style="font-size:22px">Start these steps?</h1>
        <p class="lead">MediSave for outpatient bills. 2 steps, and you confirm each one.</p><div class="btn pressme" style="margin-top:6px">Yes, start</div><p class="link">Not this</p></div>`;
    } else if (g.confirm === 'tiles') {
      body = `${title}<div class="tiles" style="margin-top:6px"><div class="tile s-pick"><i class="ring"></i><span style="color:#1F7A36">${IC.tick}</span>Yes, start</div><div class="tile"><span style="color:#B3122A">${IC.cross}</span>Not this</div></div>`;
    } else {
      body = `${title}<div class="lcards" style="margin-top:6px"><div class="lc y s-pick"><i class="ring"></i><div class="art">${IC.tick}</div><b>Yes, start</b></div><div class="lc n"><div class="art">${IC.cross}</div><b>Not this</b></div></div>`;
    }
    cycle = 2400;
  }

  if (scene === 'done') {
    body = `<div class="done">${mark(76, 'ripple')}<h1>That is every step</h1><p class="lead">MediSave for outpatient bills</p></div><div class="grow"></div><div class="btn">Ask something else</div>`;
    cycle = 2400;
  }

  el.innerHTML = `<div class="ph" data-card="${g.card}" style="${vars}">${header(g.header)}${body}</div>`;
  return cycle;
}
/* ═══════════════ END DOMAIN ═══════════════ */

</script>
</head>
<body>

  </section>
</main>

<script>
/* ═══════════════ ENGINE (generic; no need to edit) ═══════════════ */
const G = LAB.genes, GK = Object.keys(G), POOL = window.__POOL__ || LAB.pool, PARAM = typeof LAB.render === 'function';
const $ = id => document.getElementById(id);
$('brand').textContent = LAB.title; document.title = LAB.title;

// Beta posteriors + Thompson sampling
const randn = () => { let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
function gamma(k){ if (k<1) return gamma(k+1)*Math.pow(Math.random(),1/k); const d=k-1/3,c=1/Math.sqrt(9*d);
  for(;;){ let x,v; do{ x=randn(); v=1+c*x; }while(v<=0); v=v*v*v; const u=Math.random();
    if (u<1-.0331*x**4 || Math.log(u)<.5*x*x+d*(1-v+Math.log(v))) return d*v; } }
const beta = (a,b) => { const x=gamma(a), y=gamma(b); return x/(x+y); };
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

const KEY = 'lab:' + LAB.id;
function fresh(){ const post={}; for (const g of GK){ post[g]={}; for (const v in G[g].values){ const p = LAB.priors?.[g]?.[v]; post[g][v] = p ? [...p] : [1,1]; } }
  return {v:1, lab:LAB.id, rounds:0, mode:'explore', post, history:[], order:null, idx:0}; }
function normalize(s){ const f=fresh(); s=Object.assign(f,s); for (const g of GK){ s.post[g]=s.post[g]||{}; for (const v in G[g].values) if(!Array.isArray(s.post[g][v])) s.post[g][v]=f.post[g][v]; } return s; }
let S = fresh(); try { const r = localStorage.getItem(KEY); if (r) S = normalize(JSON.parse(r)); } catch(e){}

const mean = (g,v) => { const [a,b]=S.post[g][v]; return a/(a+b); };
const seen = (g,v) => { const [a,b]=S.post[g][v]; const p=LAB.priors?.[g]?.[v]||[1,1]; return Math.round((a+b-p[0]-p[1])*2)/2; };
function thompson(g, ex){ let best, bv=-1; for (const v in G[g].values){ if (v===ex) continue; const x=beta(...S.post[g][v]); if (x>bv){ bv=x; best=v; } } return best; }
function champion(){ const c={}; for (const g of GK){ let best,bm=-1; for (const v in G[g].values){ const m=mean(g,v); if (m>bm+1e-9){ bm=m; best=v; } } c[g]=best; } return c; }
const unc = g => Object.keys(G[g].values).reduce((s,v)=>{ const [a,b]=S.post[g][v]; return s + a*b/((a+b)**2*(a+b+1)); }, 0);
function status(g){ // settled | leaning | open | indifferent
  const vals = Object.keys(G[g].values).map(v=>({v, m:mean(g,v), n:seen(g,v)})).sort((x,y)=>y.m-x.m);
  const total = vals.reduce((s,x)=>s+x.n,0), gap = vals[0].m - vals[1].m;
  if (vals[0].n >= 6 && vals[0].m > .68 && gap > .15) return 'settled';
  if (total >= 12 && gap < .06) return 'indifferent';
  if (total >= 4 && gap > .08) return 'leaning';
  return 'open';
}

// Pair construction. Content (scene) is shared; style genes differ in 1–3 places.
function nextScene(){ const ids = PARAM ? LAB.scenes.map(s=>s.id) : [...new Set(POOL.map(p=>p.scene))];
  if (!S.order || S.idx >= S.order.length || !S.order.every(id=>ids.includes(id))){ S.order = shuffle(ids); S.idx = 0; } return S.order[S.idx++]; }
function targets(){
  let A = {}; if (S.mode==='explore') for (const g of GK) A[g]=thompson(g); else A = champion();
  let change;
  if (S.mode==='exploit'){ const w=GK.map(unc), t=w.reduce((a,b)=>a+b,0); let r=Math.random()*t, i=0; while (r>w[i] && i<w.length-1){ r-=w[i]; i++; } change=[GK[i]]; }
  else change = shuffle([...GK]).slice(0, S.mode==='explore' ? Math.min(GK.length, 2+(Math.random()<.5)) : 1+(Math.random()<.5));
  const B = {...A}; for (const g of change) B[g] = thompson(g, A[g]);
  return [A, B];
}
const matches = (x,y) => GK.reduce((s,g)=>s+(x[g]===y[g]),0);
function nearest(target, scene, notItem){
  let best=null, bs=-1;
  for (const it of shuffle(POOL.filter(p=>p.scene===scene && p!==notItem && (!notItem || matches(p.genes, notItem.genes) < GK.length)))){
    const s = matches(it.genes, target); if (s>bs){ bs=s; best=it; } }
  return best;
}
function makePair(){
  const scene = nextScene(); const [A, B] = targets();
  if (PARAM) return {scene, L:{genes:A}, R:{genes:B}, swap:Math.random()<.5};
  const a = nearest(A, scene), b = nearest(B, scene, a) || nearest(A, scene, a);
  return {scene, L:a, R:b, swap:Math.random()<.5};
}

// Rendering + replay loop (parametric scenes with animation return a cycle length)
const loops = new Map();
function show(el, scene, item){
  el.className = 'stage'; el.removeAttribute('style');
  if (PARAM){ el.dataset.cycle = LAB.render(el, scene, item.genes) || ''; el.classList.add('play'); }
  else { el.innerHTML = item.html; el.dataset.cycle = ''; }
}
function restart(stages){ stages.forEach(s=>s.classList.add('resetting'));
  setTimeout(()=>{ stages.forEach(s=>s.classList.remove('play')); void document.body.offsetWidth; stages.forEach(s=>{ s.classList.add('play'); s.classList.remove('resetting'); }); }, 190); }
function loop(key, stages){ clearTimeout(loops.get(key)); const c = Math.max(0, ...stages.map(s=>+s.dataset.cycle||0)); if (!c) return;
  loops.set(key, setTimeout(()=>{ restart(stages); loop(key, stages); }, c)); }
const stop = pre => { for (const [k,t] of loops) if (k.startsWith(pre)){ clearTimeout(t); loops.delete(k); } };

// Compare view
const HINT = {explore:'Bold differences, to find what you respond to. Start here.',
  balanced:'Your current favourite against a challenger that differs in one or two ways.',
  exploit:'Your favourite against one tweak to the trait the lab is least sure about.'};
let cur = null, busy = false;
function showPair(){
  cur = makePair(); if (cur.swap) [cur.L, cur.R] = [cur.R, cur.L];
  const sc = LAB.scenes.find(s=>s.id===cur.scene) || {name:cur.scene, group:''};
  $('sceneName').textContent = sc.name; $('sceneGroup').textContent = sc.group || '';
  show($('stL'), cur.scene, cur.L); show($('stR'), cur.scene, cur.R); loop('cmp', [$('stL'), $('stR')]);
}
const vn = (g,v) => G[g].values[v]?.name || v;
function vote(pick){
  if (busy || !cur) return; busy = true;
  const L = cur.L.genes, R = cur.R.genes; let msg = '';
  if (pick==='L' || pick==='R'){
    const W = pick==='L'?L:R, Lo = pick==='L'?R:L, bits=[];
    for (const g of GK) if (W[g]!==Lo[g]){ S.post[g][W[g]][0]++; S.post[g][Lo[g]][1]++; bits.push(`${vn(g,W[g])} over ${vn(g,Lo[g])} (${G[g].label.toLowerCase()})`); }
    msg = 'Learned: ' + bits.join(', ') + '.'; document.querySelector(`.pick[data-pick="${pick}"]`).classList.add('chosen');
  } else if (pick==='both' || pick==='none'){
    const i = pick==='both' ? 0 : 1; for (const g of GK) for (const v of new Set([L[g], R[g]])) S.post[g][v][i] += .5;
    msg = pick==='both' ? 'Noted: both work for you.' : 'Noted: neither. If you can say what was missing, type it below.';
  }
  if (pick !== 'skip'){
    S.rounds++; S.history.push({t:Date.now(), scene:cur.scene, mode:S.mode, pick, left:{id:cur.L.id, genes:L}, right:{id:cur.R.id, genes:R}});
    if (S.history.length > 200) S.history = S.history.slice(-200);
    save(); $('why').value = ''; $('why').classList.toggle('show', pick!=='both');
  }
  $('learned').textContent = msg; meta();
  setTimeout(()=>$('duel').classList.add('leaving'), pick==='skip'?0:420);
  setTimeout(()=>{ document.querySelectorAll('.pick').forEach(b=>b.classList.remove('chosen')); showPair(); $('duel').classList.remove('leaving'); busy=false; }, pick==='skip'?220:650);
}
document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => vote(b.dataset.pick));
$('replay').onclick = () => { restart([$('stL'),$('stR')]); loop('cmp',[$('stL'),$('stR')]); };
$('why').addEventListener('keydown', e => { if (e.key==='Enter' && $('why').value.trim()){ const h = S.history[S.history.length-1]; if (h){ h.note = $('why').value.trim(); save(); }
  $('why').value=''; $('why').classList.remove('show'); $('learned').textContent = 'Reason saved.'; } e.stopPropagation(); });
// Choose view: one dimension per screen, the rest held at the favourite. Pick the best, then
// optionally the worst. Every CHECK_EVERY-th screen repeats an earlier one to measure consistency.
const K = Math.max(2, LAB.choose || 3), CHECK_EVERY = LAB.repeatEvery ?? 8;
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ch = null, cbusy = false;
function nextGene(){ if (LAB.order) return (S.lastGene = LAB.order[Math.min(S.qi || 0, LAB.order.length - 1)]); // rotate through dimensions that are not settled yet; all of them once everything is
  const live = GK.filter(g => status(g) !== 'settled'), ids = live.length ? live : GK;
  if (!S.gorder || S.gi >= S.gorder.length || !S.gorder.every(g=>ids.includes(g))){ S.gorder = shuffle([...ids]); S.gi = 0;
    if (S.gorder.length > 1 && S.gorder[0] === S.lastGene) S.gorder.push(S.gorder.shift()); }
  return (S.lastGene = S.gorder[S.gi++]);
}
function itemFor(g, v, scene, base){ // the specimen for value v with every other dimension at the favourite
  if (PARAM) return {genes:{...base, [g]:v}};
  const pool = POOL.filter(p => p.scene===scene && p.genes[g]===v); if (!pool.length) return null;
  const t = {...base, [g]:v}; let best=null, bs=-1; for (const it of shuffle(pool)){ const s = matches(it.genes, t); if (s>bs){ bs=s; best=it; } } return best;
}
function makeBoard(){
  const n = S.history.filter(h=>h.mode==='choose').length;
  const past = S.history.filter(h=>h.mode==='choose' && h.best && !h.repeatOf && h.shown.length > 2 && GK.includes(h.gene));
  if (CHECK_EVERY > 0 && n && n % CHECK_EVERY === CHECK_EVERY-1 && past.length){ // consistency check: same set, new order
    const o = past[Math.floor(Math.random()*past.length)], base = champion();
    const cards = shuffle(o.shown.map(v => ({v, item:itemFor(o.gene, v, o.scene, base)}))).filter(c=>c.item);
    if (cards.length === o.shown.length) return {gene:o.gene, scene:o.scene, cards, repeatOf:o.t};
  }
  const g = nextGene(), scene = G[g].scene || nextScene(), base = champion();
  const vals = Object.keys(G[g].values).map(v=>({v, x:beta(...S.post[g][v])})).sort((a,b)=>b.x-a.x).map(o=>o.v);
  const cards = []; for (const v of vals){ if (cards.length >= K) break; const item = itemFor(g, v, scene, base); if (item) cards.push({v, item}); }
  return {gene:g, scene, cards:shuffle(cards)};
}
function finished(){
  ch = null; $('cGene').textContent = 'All ' + LAB.order.length + ' done'; $('cScene').textContent = ''; $('cStep').textContent = '';
  $('cHint').textContent = 'Here is Suara with every choice you made. Reset on the Profile tab starts again.';
  $('board').style.setProperty('--k', 1); $('board').innerHTML = '<p class="learned">Opening your Suara…</p>';
  meta(); setTimeout(() => document.querySelector('[data-tab="profile"]').click(), 700);
}
function source(v){ const s = v.source; if (!s) return '';
  if (typeof s === 'string') return `<i>${esc(s)}</i>`;
  return s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name||'Source')}</a>` : `<i>${esc(s.name)}</i>`; }
function showBoard(){
  if (LAB.order && (S.qi || 0) >= LAB.order.length) return finished();
  ch = makeBoard(); ch.phase = 'best';
  if (ch.cards.length < 2){ $('board').innerHTML = `<p class="learned">Not enough options for ${esc(G[ch.gene].label)} in this scene. Add values or pool items.</p>`; return; }
  const sc = LAB.scenes.find(s=>s.id===ch.scene) || {name:ch.scene};
  $('cGene').textContent = G[ch.gene].label; $('cScene').textContent = sc.name + (ch.repeatOf ? ' · checking an earlier pick' : '');
  $('board').style.setProperty('--k', ch.cards.length);
  $('board').innerHTML = ch.cards.map((c,i) => { const val = G[ch.gene].values[c.v];
    return `<div class="card" data-i="${i}"><div class="stage"></div><div class="cap"><b>${esc(val.name||c.v)}</b>${source(val)}</div>
      <button class="pick" data-card="${i}">Best<kbd>${i+1}</kbd></button></div>`; }).join('');
  const stages = [...$('board').querySelectorAll('.stage')];
  ch.cards.forEach((c,i) => show(stages[i], ch.scene, c.item)); loop('cho', stages);
  $('board').querySelectorAll('[data-card]').forEach(b => b.onclick = () => choose(+b.dataset.card));
  phase('best');
}
function phase(p){ ch.phase = p; const n = ch.cards.length;
  $('cStep').textContent = p==='best' ? 'Which is best?' : 'And the one you like least?';
  const also = GK.filter(g => g !== ch.gene && new Set(ch.cards.map(c=>c.item.genes?.[g])).size > 1).map(g => G[g].label.toLowerCase());
  $('cHint').textContent = p==='worst' ? 'Optional, but it teaches the lab twice as much. Enter skips.'
    : also.length ? `These also differ in ${also.join(' and ')}: the pool has no cleaner set. Judge the ${G[ch.gene].label.toLowerCase()}; only it is credited.`
    : `Only the ${G[ch.gene].label.toLowerCase()} changes between these ${n}. Everything else is your current favourite.`;
  $('cSkip').textContent = p==='best' ? 'Skip' : 'Skip this'; $('cSkip').querySelector('kbd')?.remove();
  if (p==='worst') $('cSkip').insertAdjacentHTML('beforeend','<kbd>Enter</kbd>');
  $('board').querySelectorAll('.card').forEach((el,i) => { const b = el.querySelector('.pick');
    if (p==='best'){ b.hidden = false; b.classList.remove('worst-mode'); b.firstChild.textContent = 'Best'; return; }
    el.classList.add('done'); if (i===ch.best){ b.firstChild.textContent = 'Best'; b.disabled = true; return; }
    b.classList.add('worst-mode'); b.firstChild.textContent = 'Least'; });
}
function credit(g, w, l){ S.post[g][w][0]++; S.post[g][l][1]++; }
function choose(i){
  if (cbusy || !ch || i >= ch.cards.length) return;
  const g = ch.gene, shown = ch.cards.map(c=>c.v);
  if (ch.phase === 'best'){
    ch.best = i; const b = shown[i];
    for (const v of shown) if (v !== b) credit(g, b, v);
    ch.rec = {t:Date.now(), mode:'choose', gene:g, scene:ch.scene, shown, best:b, worst:null, pick:'best', ...(ch.repeatOf ? {repeatOf:ch.repeatOf} : {})};
    S.rounds++; S.qi = (S.qi || 0) + 1; S.history.push(ch.rec); if (S.history.length > 300) S.history = S.history.slice(-300); save(); meta();
    $('board').querySelector(`.card[data-i="${i}"]`).classList.add('best');
    $('cLearned').textContent = `Learned: ${vn(g,b)} over ${shown.filter(v=>v!==b).map(v=>vn(g,v)).join(' and ')}.`;
    $('cWhy').value = ''; $('cWhy').classList.add('show');
    if (shown.length > 2 && LAB.askWorst !== false) phase('worst'); else nextBoard();
    return;
  }
  if (i === ch.best) return;
  const w = shown[i]; for (const v of shown) if (v !== w && v !== shown[ch.best]) credit(g, v, w);
  ch.rec.worst = w; save();
  $('board').querySelector(`.card[data-i="${i}"]`).classList.add('worst');
  $('cLearned').textContent += ` Least: ${vn(g,w)}.`; nextBoard();
}
function chooseOther(kind){ // both = no clear favourite, none = none of these, skip
  if (cbusy || !ch) return;
  if (ch.phase === 'worst'){ nextBoard(); return; }
  if (kind !== 'skip' && ch.cards.length){ const g = ch.gene, shown = ch.cards.map(c=>c.v), idx = kind==='both' ? 0 : 1;
    for (const v of shown) S.post[g][v][idx] += .5;
    ch.rec = {t:Date.now(), mode:'choose', gene:g, scene:ch.scene, shown, best:null, worst:null, pick:kind, ...(ch.repeatOf ? {repeatOf:ch.repeatOf} : {})};
    S.rounds++; S.history.push(ch.rec); save(); meta();
    $('cLearned').textContent = kind==='both' ? `Noted: no clear favourite for ${G[g].label.toLowerCase()}. It may not matter to you.`
      : 'Noted: none of these. Say what was missing below; it tells me which options to source next.';
    $('cWhy').value = ''; $('cWhy').classList.add('show');
  }
  if (LAB.order) { S.qi = (S.qi || 0) + (kind === 'skip' || ch.cards.length ? 1 : 0); save(); meta(); }
  nextBoard(kind==='skip' ? 0 : 420);
}
function nextBoard(wait = 520){ cbusy = true;
  setTimeout(()=>$('board').classList.add('leaving'), wait);
  setTimeout(()=>{ stop('cho'); showBoard(); $('board').classList.remove('leaving'); cbusy = false; }, wait + 240); }
document.querySelectorAll('[data-choose]').forEach(b => b.onclick = () => chooseOther(b.dataset.choose));
$('cReplay').onclick = () => { const st = [...$('board').querySelectorAll('.stage')]; restart(st); loop('cho', st); };
$('cWhy').addEventListener('keydown', e => { if (e.key==='Enter' && $('cWhy').value.trim()){ const h = [...S.history].reverse().find(x=>x.mode==='choose');
  if (h){ h.note = $('cWhy').value.trim(); save(); } $('cWhy').value=''; $('cWhy').classList.remove('show'); $('cLearned').textContent = 'Reason saved.'; } e.stopPropagation(); });
function consistency(){ const out = {};
  for (const h of S.history) if (h.mode==='choose' && h.repeatOf && h.best){ const o = S.history.find(x=>x.t===h.repeatOf); if (!o || !o.best) continue;
    const r = out[h.gene] ||= {checks:0, agreed:0}; r.checks++; r.agreed += o.best===h.best; }
  return out; }

function setMode(m){ S.mode=m; document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===m)); $('hint').textContent = HINT[m]; }
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { setMode(b.dataset.mode); save(); showPair(); });
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return;
  if (!$('choose').hidden){
    if (/^[1-9]$/.test(e.key)){ e.preventDefault(); choose(+e.key - 1); return; }
    const k = {ArrowUp:'both', ArrowDown:'none', Enter:'skip'}[e.key];
    if (k && (k!=='skip' || ch?.phase==='worst')){ e.preventDefault(); chooseOther(k); } else if (e.key===' '){ e.preventDefault(); $('cReplay').click(); }
    return; }
  if ($('compare').hidden) return;
  const k = {ArrowLeft:'L', ArrowRight:'R', ArrowUp:'both', ArrowDown:'none'}[e.key];
  if (k){ e.preventDefault(); vote(k); } else if (e.key===' '){ e.preventDefault(); $('replay').click(); } });

// Profile view
function renderProfile(){
  const c = champion(), n = S.rounds, neither = S.history.filter(h=>h.pick==='none').length, cons = consistency();
  $('note').textContent = LAB.order ? `${Math.min(S.qi || 0, LAB.order.length)} of ${LAB.order.length} choices made. One pick per decision: these are your choices put together, not a settled estimate.` : n < 12 ? `${n} round${n===1?'':'s'} so far. Early picks move things a lot; each trait needs roughly 6+ showings to settle.`
    : `${n} rounds. ${neither/n > .3 ? 'You pick "Neither" often, which usually means what you want is outside these options.' : 'Darker bar is the current favourite; the number is how many times that option was shown in a decisive pick.'}`;
  $('genes').innerHTML = GK.map(g => `<div class="gene"><h3>${G[g].label}<em>${status(g)}${cons[g] ? ` · same pick ${cons[g].agreed}/${cons[g].checks}` : ''}</em></h3>${Object.keys(G[g].values).map(v =>
    `<div class="gv${c[g]===v?' lead':''}"><span>${vn(g,v)}</span><span class="track"><i style="width:${Math.round(mean(g,v)*100)}%"></i></span><em>${seen(g,v)}</em></div>`).join('')}</div>`).join('');
  stop('gal');
  const scenes = PARAM ? LAB.scenes.map(s=>s.id) : [...new Set(POOL.map(p=>p.scene))];
  $('gallery').innerHTML = scenes.map(id => { const s = LAB.scenes.find(x=>x.id===id) || {name:id}; return `<div class="gcell"><div class="stage" data-scene="${id}"></div><div class="cap">${s.name}</div></div>`; }).join('');
  $('gallery').querySelectorAll('.stage').forEach(el => { const id = el.dataset.scene; show(el, id, PARAM ? {genes:c} : nearest(c, id)); loop('gal-'+id, [el]); });
}
function summary(){
  const c = champion(), fav = {}, post = {};
  for (const g of GK){ const {name, ...rest} = G[g].values[c[g]]; fav[g] = {choice:c[g], name, status:status(g), ...rest};
    post[g] = Object.fromEntries(Object.keys(G[g].values).map(v=>[v,{winRate:+mean(g,v).toFixed(3), seen:seen(g,v)}])); }
  const decisive = S.history.filter(h=>h.pick==='L'||h.pick==='R').slice(-12).map(h=>{ const w=h.pick==='L'?h.left:h.right, l=h.pick==='L'?h.right:h.left; return {scene:h.scene, winner:w, loser:l, note:h.note}; });
  return {lab:LAB.id, rounds:S.rounds, neitherRate:S.rounds? +(S.history.filter(h=>h.pick==='none').length/S.rounds).toFixed(2):0,
    favourite:fav, posteriors:post, recentDecisive:decisive, consistency:consistency(),
    notes:S.history.filter(h=>h.note).map(h=>({pick:h.pick, scene:h.scene, ...(h.gene ? {gene:h.gene, best:h.best} : {}), note:h.note}))};
}
document.querySelectorAll('[role="tab"]').forEach(b => b.onclick = () => { const t=b.dataset.tab;
  document.querySelectorAll('[role="tab"]').forEach(x=>x.setAttribute('aria-selected', x===b));
  for (const id of ['choose','compare','profile']) $(id).hidden = t!==id;
  stop('cmp'); stop('cho'); stop('gal'); $('gallery').innerHTML='';
  if (t==='profile') renderProfile(); else if (t==='compare') showPair(); else showBoard(); });
$('copy').onclick = async () => { const txt = JSON.stringify(summary(), null, 2);
  try { await navigator.clipboard.writeText(txt); $('copy').textContent='Copied'; setTimeout(()=>$('copy').textContent='Copy profile',1400); }
  catch(e){ $('exportText').value = txt; $('export').classList.add('show'); $('exportText').select(); } };
let armed = false;
$('reset').onclick = () => { if (!armed){ armed=true; $('reset').textContent='Click again to reset'; setTimeout(()=>{armed=false; $('reset').textContent='Reset';},2500); return; }
  armed=false; $('reset').textContent='Reset'; const m=S.mode; S=fresh(); S.mode=m; save(); meta(); renderProfile(); };

// Persistence: localStorage always; plus a local server (Claude Code) or the artifact db (claude.ai)
let remote = null, saving = false, dirty = false;
const meta = () => $('rounds').textContent = LAB.order ? `${Math.min((S.qi || 0) + 1, LAB.order.length)} of ${LAB.order.length}` : `${S.rounds} round${S.rounds===1?'':'s'}`;
const sync = t => $('sync').textContent = t;
async function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (!remote) return; if (saving){ dirty=true; return; } saving = true;
  try { await remote.put({state:S, summary:summary(), updatedAt:new Date().toISOString()}); sync(remote.label); } catch(e){ sync('Saved on this device'); }
  saving = false; if (dirty){ dirty=false; save(); }
}
async function adopt(doc){ if (doc && doc.state && doc.state.lab===LAB.id && doc.state.rounds >= S.rounds){ S = normalize(JSON.parse(JSON.stringify(doc.state))); setMode(S.mode); meta(); if (!$('profile').hidden) renderProfile(); } else if (S.rounds) save(); }
async function initRemote(){
  if (['localhost','127.0.0.1'].includes(location.hostname)){
    try { const r = await fetch('/api/state'); remote = {label:'Saved to project', put: d => fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(x=>{ if(!x.ok) throw 0; })};
      await adopt(r.ok ? await r.json() : null); sync(remote.label); return; } catch(e){ remote = null; } }
  try { if (!window.claude?.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); if (!db || !user) return;
    const uid = await user.id(); if (!uid) return; const ref = db.doc(`data/users/${uid}/${LAB.id}`);
    const snap = await ref.get(); remote = {label:'Synced', put: d => ref.set(d)}; await adopt(snap.exists ? snap.data() : null); sync('Synced');
  } catch(e){ remote = null; }
}
setMode(S.mode); meta(); showBoard(); initRemote();
</script>
