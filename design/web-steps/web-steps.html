<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Suara — answers from the web (clickable mockup)</title>
<!--
  Mobile-first, clickable mockup for vault plan suara-2026-09-25-feature-web-steps.
  No backend: the answers are real gpt-6-luna web_search runs (fixtures.json, inlined below),
  and the search wait is shortened. Serve the suara/ folder and open /design/web-steps/web-steps.html
    ?q=<key>&v=result|step|done     open straight at a screen (keys: see FX)
    ?canvas=1                       every screen side by side, at phone width
-->
<style>
@font-face { font-family: 'Atkinson Hyperlegible Next'; src: url('../../public/fonts/atkinson-hyperlegible-next-latin.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
:root {
  --ink: #1d1d1f; --muted: #5f5f64; --line: #e5e5ea; --line-strong: #c7c7cc; --subtle: #f5f5f7; --surface: #fff;
  --light: #007aff; --yes: #1f7a36; --skeleton: #ebebeb;
  --shadow: 0 1px 2px rgb(0 0 0 / 5%), 0 8px 22px rgb(0 0 0 / 8%);
  --r: 20px; --pad: clamp(16px, 5vw, 28px); --col: 560px;
  --t-h1: clamp(1.75rem, 1.2rem + 2.6vw, 2.25rem); --t-title: clamp(1.4rem, 1.05rem + 1.8vw, 1.75rem);
  --t-body: clamp(1.0625rem, 1rem + .35vw, 1.25rem); --t-small: 1rem; --t-fine: .875rem;
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: 'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg { display: block; flex: none; }

/* One readable column on any screen; on a wide screen it sits as a card on grey. */
.app { width: 100%; max-width: var(--col); margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column; background: #fff; }
@media (min-width: 720px) {
  body { background: var(--subtle); }
  .app { margin: 24px auto; min-height: calc(100svh - 48px); border-radius: 28px; box-shadow: 0 0 0 1px var(--line), 0 24px 60px -30px rgb(0 0 0 / 25%); overflow: hidden; }
}
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top)) var(--pad) 12px; background: rgb(255 255 255 / 92%); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.mk { width: 40px; height: 40px; border-radius: 12px; background: #000; display: grid; place-items: center; color: #fff; }
.nm { font-size: 1.3rem; font-weight: 700; letter-spacing: -.02em; margin-right: auto; border: 0; background: none; padding: 0; }
.pill { min-height: 48px; padding: 0 16px; border-radius: 999px; background: var(--subtle); border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 600; }
@media (max-width: 370px) { .pill .tx { display: none; } .pill { padding: 0 13px; } }
.page { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px var(--pad) calc(32px + env(safe-area-inset-bottom)); }
.page > * { animation: rise .32s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

h1 { font-size: var(--t-h1); line-height: 1.12; font-weight: 700; letter-spacing: -.03em; text-wrap: balance; }
.lead { font-size: var(--t-body); color: var(--muted); line-height: 1.45; text-wrap: pretty; }
.small { font-size: var(--t-small); color: var(--muted); line-height: 1.45; }
.said { font-size: var(--t-small); color: var(--muted); padding: 14px 18px; border-radius: var(--r); border: 1px solid var(--line); line-height: 1.4; }
.said b { color: var(--ink); font-weight: 600; }

/* Home: the questions the real search answered */
.qs { display: grid; gap: 10px; }
.q { display: grid; gap: 4px; text-align: left; width: 100%; min-height: 64px; padding: 16px 18px; border-radius: var(--r); border: 0; background: var(--surface); box-shadow: var(--shadow); }
.q:active { transform: scale(.99); }
.q b { font-size: var(--t-body); font-weight: 600; line-height: 1.3; }
.q span { font-size: var(--t-small); color: var(--muted); }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 12px; }
.badge { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--subtle); font-size: .95rem; font-weight: 700; width: max-content; max-width: 100%; }
.title { font-size: var(--t-title); font-weight: 700; letter-spacing: -.02em; line-height: 1.18; text-wrap: balance; }
.sum, .answer { font-size: var(--t-body); line-height: 1.5; }
.sum { color: var(--muted); }
.meta { font-size: var(--t-small); color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.pre { font-size: var(--t-small); line-height: 1.45; padding: 12px 14px; border-radius: 14px; background: var(--subtle); }
.pre b { font-weight: 700; }

.btn { min-height: 64px; width: 100%; border-radius: 999px; border: 0; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 20px; font-size: 1.2rem; font-weight: 600; text-align: center; transition: transform .12s ease-out; }
.btn:active { transform: scale(.98); }
.btn.quiet { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line-strong); min-height: 56px; font-size: 1.1rem; }
.btn.yes { background: var(--yes); }
.link { background: none; border: 0; min-height: 48px; font-size: 1.1rem; font-weight: 600; text-decoration: underline; text-underline-offset: .25em; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; background: none; border: 0; font-size: 1.1rem; font-weight: 600; align-self: flex-start; padding: 0; }

/* Legal: always open when it applies, clearly marked */
.legal { display: grid; gap: 8px; padding: 16px 18px; border-radius: var(--r); border: 2px solid var(--ink); background: #fff; }
.legal .lh { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.legal p { font-size: var(--t-body); line-height: 1.45; }
/* Good to know: folded until tapped; the marked note only shows when open */
.more { border-radius: var(--r); border: 1px solid var(--line); background: #fff; }
.more > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 12px 18px; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary small { font-size: var(--t-small); font-weight: 400; color: var(--muted); }
.more[open] > summary svg { transform: rotate(180deg); }
.note { display: flex; gap: 12px; margin: 0 12px 12px; padding: 14px 16px; border-radius: 16px; background: #fff8e6; border: 1px solid #f0d9a0; font-size: var(--t-small); line-height: 1.45; color: #5c3d00; }
.note .ln { display: grid; gap: 8px; }
.sources { border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.sources .h { padding: 12px 18px; font-size: .9rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; background: var(--subtle); }
.src { display: grid; gap: 2px; padding: 12px 18px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
.src b { font-size: var(--t-small); font-weight: 600; }
.src span { font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
/* Fine print, always, in a bubble */
.fine { align-self: flex-start; padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: var(--subtle); font-size: var(--t-fine); line-height: 1.45; color: var(--muted); }

/* Searching: what is happening, not a blank wait */
.stages { display: grid; gap: 14px; }
.stage { display: flex; align-items: center; gap: 12px; font-size: var(--t-body); color: var(--muted); transition: color .2s; }
.stage i { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line-strong); }
.stage[data-s="done"] { color: var(--ink); }
.stage[data-s="done"] i { background: var(--light); box-shadow: none; }
.stage[data-s="done"] i::after { content: ''; width: 10px; height: 6px; border: solid #fff; border-width: 0 0 2.6px 2.6px; transform: translateY(-1px) rotate(-45deg); }
.stage[data-s="now"] { color: var(--ink); font-weight: 600; }
.stage[data-s="now"] i { box-shadow: inset 0 0 0 2px var(--ink); }
.stage[data-s="now"] i::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); animation: pulse 1.2s ease-in-out infinite; }
.skel { display: grid; gap: 12px; padding: 20px; border-radius: var(--r); background: #fff; box-shadow: var(--shadow); }
.skel i { display: block; height: 14px; border-radius: 4px; background: var(--skeleton); animation: pulse 1.4s ease-in-out infinite; }
.skel i:nth-child(1) { width: 34%; } .skel i:nth-child(2) { width: 86%; height: 22px; } .skel i:nth-child(3) { width: 64%; }
@keyframes pulse { 50% { opacity: .45; } }

/* Steps: any number; done ones fold, the current one opens, the rest fold */
.prog { display: grid; gap: 10px; }
.prog .lbl { font-size: .95rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--light); border-radius: 3px; transform-origin: left; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.row { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 10px 18px; border-radius: var(--r); background: #fff; border: 1px solid var(--line); font-size: var(--t-small); color: var(--muted); }
.row .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--subtle); font-weight: 700; font-size: .95rem; color: var(--ink); }
.row.done .n { background: var(--light); color: #fff; }
.later > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 10px 18px; border-radius: var(--r); background: var(--subtle); font-size: var(--t-small); font-weight: 600; cursor: pointer; }
.later > summary::-webkit-details-marker { display: none; }
.later[open] > summary svg { transform: rotate(180deg); }
.later .rows { display: grid; gap: 10px; margin-top: 10px; }
.now { border: 2px solid var(--ink); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; background: #fff; }
.now .hd { display: flex; align-items: center; gap: 14px; }
.now .n { width: 40px; height: 40px; border-radius: 50%; background: #000; color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.now .nm2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
.now p { font-size: var(--t-body); line-height: 1.5; }
.now .from { font-size: .9rem; color: var(--muted); text-decoration: underline; text-underline-offset: .2em; overflow-wrap: anywhere; }

/* Done */
.fin { display: grid; justify-items: center; text-align: center; gap: 14px; padding: 40px 0 8px; }
.tick { width: 88px; height: 88px; border-radius: 50%; background: var(--light); display: grid; place-items: center; color: #fff; animation: pop .45s cubic-bezier(.34, 1.4, .5, 1) both; }
.tick svg { width: 46px; height: 46px; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .35s ease-out .25s forwards; }
@keyframes pop { from { transform: scale(0); } }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* Confirm sheet, pinned to the real viewport */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / 32%); animation: fade .25s ease-out both; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; width: 100%; max-width: var(--col); margin: 0 auto; background: #fff; border-radius: 32px 32px 0 0;
  padding: 28px var(--pad) calc(22px + env(safe-area-inset-bottom)); display: grid; gap: 12px; text-align: center; box-shadow: 0 8px 28px rgb(0 0 0 / 28%); animation: up .36s cubic-bezier(.2, .8, .2, 1) both; }
.sheet h2 { font-size: var(--t-title); font-weight: 700; letter-spacing: -.02em; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

.demo { font-size: var(--t-fine); color: var(--muted); text-align: center; }

/* Canvas: every screen at phone width */
.canvas { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; background: #dcdde3; }
.art { display: grid; gap: 8px; }
.art > span { font: 600 14px system-ui; color: #3a3a3c; }
.art iframe { width: 390px; height: 844px; border: 0; border-radius: 28px; box-shadow: 0 0 0 6px #0d0d10; background: #fff; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>

quisites": "", "steps": [], "legal": {"applies": false, "text": "", "source_urls": []}, "disclaimer": "", "sources": [], "cautions": []}}};</script>
<script>
const I = {
  wave: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10.5v3"/></svg>',
  find: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>',
  globe: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  info: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/></svg>',
  scale: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/></svg>',
  chev: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  tick: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
};
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sitesLine = (g) => [...new Set(g.sources.map((s) => s.site))].join(', ');
const siteOf = (u) => Object.values(FX).flatMap((f) => f.guide.sources).find((s) => s.url === u) || { site: (() => { try { return new URL(u).hostname; } catch { return u; } })(), title: '' };
const official = (g) => g.sources.length > 0 && g.sources.every((s) => { try { return new URL(s.url).hostname.endsWith('.gov.sg'); } catch { return false; } });
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const kindLine = (f) => { const g = f.guide; if (g.kind === 'none') return 'No reliable answer (example)'; if (g.kind === 'answer') return 'An answer' + (g.legal.applies ? ' · with a legal note' : '');
  return plural(g.steps.length, 'step', 'steps') + (f.dropped ? ` · ${f.dropped} left out` : '') + (g.legal.applies ? ' · with a legal note' : ''); };

/* ── screens ── */
function home() {
  return `<h1>Ask anything</h1>
    <p class="lead">Tap a question. Each one was answered by the real Luna web search.</p>
    <div class="qs">${Object.entries(FX).map(([k, f]) => `<button class="q" data-go="search" data-q="${k}"><b>${esc(f.question)}</b><span>${esc(kindLine(f))}</span></button>`).join('')}</div>
    <p class="demo">Clickable mockup. Searches are shortened from about 15 seconds to 3.</p>`;
}
function searching(k, stage) {
  const st = (i) => (i < stage ? 'done' : i === stage ? 'now' : 'todo');
  const f = FX[k], site = f.guide.sources[0] ? new URL(f.guide.sources[0].url).hostname.replace(/^www\./, '') : 'the web';
  return `<div class="said">You said <b>${esc(f.question)}</b></div>
    <h1>Searching the web</h1>
    <div class="stages">
      <div class="stage" data-s="${st(0)}"><i></i>Searching ${esc(site)}</div>
      <div class="stage" data-s="${st(1)}"><i></i>Reading ${plural(f.guide.sources.length || 3, 'page', 'pages')}</div>
      <div class="stage" data-s="${st(2)}"><i></i>${f.guide.kind === 'answer' ? 'Writing your answer' : 'Writing your steps'}</div>
    </div>
    <div class="skel"><i></i><i></i><i></i></div>
    <p class="small">This usually takes about 15 seconds.</p>`;
}
const goodToKnow = (summary, lines) => `<details class="more"><summary><span>Good to know <small>· ${esc(summary)}</small></span>${I.chev}</summary>
  <div class="note">${I.info}<div class="ln">${lines.map((c) => `<span>${esc(c)}</span>`).join('')}</div></div></details>`;
function tail(f) {
  const g = f.guide, cautions = [...(f.dropped ? [`I could only check ${plural(g.steps.length, 'step', 'steps')} of ${g.steps.length + f.dropped} against the pages I found, so I left ${f.dropped} out.`] : []), ...g.cautions];
  return `${g.legal.applies ? `<section class="legal"><span class="lh">${I.scale}Legal</span><p>${esc(g.legal.text)}</p></section>` : ''}
    ${cautions.length ? goodToKnow(f.dropped ? `${f.dropped} steps left out` : plural(cautions.length, 'thing to check', 'things to check'), cautions.slice(0, 4)) : ''}
    ${g.sources.length ? `<div class="sources"><div class="h">WHERE THIS IS FROM · ${plural(g.sources.length, 'PAGE', 'PAGES')}</div>
      ${g.sources.map((s) => `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener"><b>${esc(s.site)}</b><span>${esc(s.title)}</span></a>`).join('')}</div>` : ''}
    <p class="fine">${official(g) ? 'From official government pages, found by web search.' : 'Found on the web, not an official answer.'}${g.disclaimer ? ' ' + esc(g.disclaimer) : ''}</p>`;
}
function result(k) {
  const f = FX[k], g = f.guide;
  const said = `<div class="said">You said <b>${esc(f.question)}</b></div>`;
  if (g.kind === 'none') return `${said}<h1>I could not find a reliable answer</h1><p class="lead">${esc(g.summary)}</p><button class="btn" data-go="home">Ask again</button>`;
  if (g.kind === 'answer') return `${said}<article class="card"><span class="badge">${I.globe}From the web</span><p class="title">${esc(g.title_full)}</p>
      <p class="answer">${esc(g.answer)}</p><p class="meta">${esc(sitesLine(g))}</p></article>${tail(f)}
      <button class="btn quiet" data-go="home">Ask something else</button>`;
  return `${said}<article class="card"><span class="badge">${I.globe}From the web</span><p class="title">${esc(g.title_full)}</p><p class="sum">${esc(g.summary)}</p>
      ${g.prerequisites ? `<p class="pre"><b>Before you start:</b> ${esc(g.prerequisites.replace(/^You need /, 'you need '))}</p>` : ''}
      <p class="meta"><b>${plural(g.steps.length, 'step', 'steps')}</b> · ${esc(sitesLine(g))}</p>
      <button class="btn" data-go="confirm" data-q="${k}">Start guide</button></article>${tail(f)}`;
}
function step(k, i) {
  const g = FX[k].guide, n = g.steps.length, s = g.steps[i], src = siteOf(s.source_urls[0]);
  const done = i ? `<div class="row done"><span class="n">${I.tick}</span>${i === 1 ? esc(g.steps[0].name) : `${i} steps done`}</div>` : '';
  const next = g.steps.slice(i + 1, i + 3).map((x, j) => `<div class="row"><span class="n">${i + 2 + j}</span>${esc(x.name)}</div>`).join('');
  const rest = g.steps.slice(i + 3);
  return `<button class="back" data-go="result" data-q="${k}">${I.back}Answer</button>
    <div class="prog"><span class="lbl">Step ${i + 1} of ${n}</span><div class="track"><i style="transform:scaleX(${(i + 1) / n})"></i></div></div>
    <h1>${esc(g.title_short)}</h1>
    ${done}
    <div class="now"><div class="hd"><span class="n">${i + 1}</span><span class="nm2">${esc(s.name)}</span></div>
      <p>${esc(s.text)}</p><a class="from" href="${esc(s.source_urls[0])}" target="_blank" rel="noopener">From ${esc(src.site)}${src.title ? ' · ' + esc(src.title) : ''}</a>
      <button class="btn yes" data-go="${i + 1 < n ? 'step' : 'done'}" data-q="${k}" data-i="${i + 1}">${I.tick}${esc(s.confirm_label)}</button>
      <button class="btn quiet" data-go="read">Read again</button></div>
    ${next}
    ${rest.length ? `<details class="later"><summary><span>${plural(rest.length, 'more step', 'more steps')}</span>${I.chev}</summary><div class="rows">${rest.map((x, j) => `<div class="row"><span class="n">${i + 4 + j}</span>${esc(x.name)}</div>`).join('')}</div></details>` : ''}`;
}
function done(k) {
  const g = FX[k].guide;
  return `<div class="fin"><span class="tick">${I.tick}</span><h1>That is every step</h1><p class="lead">${esc(g.title_full)}</p></div>
    <button class="btn" data-go="home">Ask something else</button>`;
}
const sheet = (k) => { const g = FX[k].guide; return `<div class="scrim" data-go="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">
  <h2 id="sh">Start these ${plural(g.steps.length, 'step', 'steps')}?</h2><p class="lead">You confirm each one. You can stop at any time.</p>
  <button class="btn" data-go="step" data-q="${k}" data-i="0">Yes, start</button><button class="link" data-go="close">Not this</button></section>`; };

/* ── driver: one state, the browser's Back button works ── */
const q0 = new URLSearchParams(location.search);
const bar = `<header class="bar"><span class="mk">${I.wave}</span><button class="nm" data-go="home">Suara</button><span class="pill">${I.find}<span class="tx">Find</span></span><span class="pill">English</span></header>`;
let S = { v: 'home' }, timers = [];
function paint() {
  timers.forEach(clearTimeout); timers = [];
  const main = document.getElementById('main'), over = document.getElementById('over');
  const v = S.v === 'confirm' ? 'result' : S.v;
  main.innerHTML = v === 'home' ? home() : v === 'search' ? searching(S.q, 0) : v === 'result' ? result(S.q) : v === 'step' ? step(S.q, S.i || 0) : done(S.q);
  over.innerHTML = S.v === 'confirm' ? sheet(S.q) : '';
  if (S.v !== 'confirm') window.scrollTo({ top: 0 });
  if (S.v === 'search') {
    [900, 1900].forEach((t, n) => timers.push(setTimeout(() => { main.innerHTML = searching(S.q, n + 1); }, t)));
    timers.push(setTimeout(() => go({ v: 'result', q: S.q }, true), 3100));
  }
}
function go(next, replace) {
  S = next;
  const url = `?q=${S.q || ''}&v=${S.v}${S.i ? '&i=' + S.i : ''}`;
  replace ? history.replaceState(S, '', url) : history.pushState(S, '', url);
  paint();
}
window.addEventListener('popstate', (e) => { S = e.state || { v: 'home' }; paint(); });
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go]'); if (!t) return;
  const to = t.dataset.go, k = t.dataset.q || S.q;
  if (to === 'read') return;
  if (to === 'close') return history.back();
  go({ v: to, q: k, i: t.dataset.i ? +t.dataset.i : 0 });
});

if (q0.get('canvas')) {
  const shots = [['home'], ['search', 'tripcom'], ['result', 'tripcom'], ['confirm', 'tripcom'], ['step', 'tripcom', 0], ['step', 'tripcom', 3], ['result', 'coinbase'], ['result', 'scooter'], ['result', 'cpf'], ['result', 'ibkr'], ['step', 'ibkr', 4], ['result', 'singpass'], ['result', 'none'], ['done', 'tripcom']];
  document.getElementById('root').innerHTML = `<div class="canvas">${shots.map(([v, k, i]) => `<div class="art"><span>${v}${k ? ' · ' + k : ''}${i != null ? ' · step ' + (i + 1) : ''}</span><iframe loading="lazy" src="?v=${v}&q=${k || ''}${i != null ? '&i=' + i : ''}&still=1"></iframe></div>`).join('')}</div>`;
} else {
  document.getElementById('root').innerHTML = `<div class="app">${bar}<main class="page" id="main"></main></div><div id="over"></div>`;
  const v = q0.get('v') || 'home', k = q0.get('q');
  S = v === 'home' || !FX[k] ? { v: 'home' } : { v, q: k, i: +(q0.get('i') || 0) };
  if (q0.get('still') && S.v === 'search') { history.replaceState(S, '', location.search); document.getElementById('main').innerHTML = searching(k, 1); }
  else { history.replaceState(S, '', location.search); paint(); }
}
</script>
